# bikelane-extract — LEXINGTON, MA
# Region-dependent values derived Sept 2026 (see comments); everything else from default.yaml.

extends: default.yaml

region: LEXINGTON
city: Lexington            # county-subdivision name used by pygris (stage 0)
state: MA
crs: "EPSG:32619"          # UTM 19N
data_root: /cura/ssynn3/RMN/bikelane-extract-data

# existing layout on analytica — nothing has to move
paths:
  # stage 0 (imagery)
  massdot_index_shp: /cura/ssynn3/RMN/04_Pipeline/Data/Aerial_Shapefile/COQ2025INDEX_POLY.shp
  mosaic_tif:        /cura/ssynn3/RMN/04_Pipeline/Data/Aerial_Images/Lexington/Merged_Lexington.tif
  tiles_dir:         /cura/ssynn3/RMN/04_Pipeline/Data/Aerial_Images/LEXINGTON/LEXINGTON_Tiled
  tile_mappings_csv: /cura/ssynn3/RMN/04_Pipeline/Data/Aerial_Images/LEXINGTON/Tile_Mappings.csv
  # stage 3 (predict)
  predictions_dir:   /cura/ssynn3/RMN/05_OpenSatMap/predictions/LEXINGTON
  # stage 4 (centerlines)
  centerlines_dir:   /cura/ssynn3/RMN/05_OpenSatMap
  # stages 5-7 (signs / join / gaps)
  signs_dir:         /cura/ssynn3/RMN/04_YOLO_Bikesign/Final/lexington_detections
  bikelanes_dir:     /cura/ssynn3/RMN/04_YOLO_Bikesign/Final/lexington_detections
  osm_dir:           /cura/ssynn3/RMN/06_OSM
  # stages 1-2 (prepare / train) — region-independent
  opensatmap_dir:        /cura/ssynn3/RMN/05_OpenSatMap/OpenSatMap
  opensatmap_tools_dir:  /cura/ssynn3/RMN/05_OpenSatMap/tools-release
  prep_work_dir:         /cura/ssynn3/RMN/05_OpenSatMap/prep_work
  ckpt_dir:              /cura/ssynn3/RMN/05_OpenSatMap/prep_work/ckpts_A2

signs:
  conf_keep:               # signs filter --sweep: isolated share bottoms out ~0.55, chosen 0.60
    BikeOnly: 0.60
    Sharrow: 0.60
    OnlyBikeBus: 1.01      # 5 detections, all false positives → class dropped

join:
  radius_m: 2.0            # join match --sweep: lines/sign flat to 2.0 m, jumps at 3.0 m

gaps:
  scan:                    # gaps scan --sweep, then all 88 candidates checked in QGIS
    gap_max_m: 25.0        # growth flattens 25→30 m
    ang: 12.0
    lat_max_m: 1.0
